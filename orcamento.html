  <main>
    <section class="orcamento-section">
      <h1>Solicite seu Orçamento</h1>
      <form id="orcamento-form">
        <label for="tipo">Tipo de serviço:</label>
        <select id="tipo" name="tipo" required>
          <option value="">Selecionar...</option>
          <option value="coletivo">Transporte coletivo</option>
          <option value="fretamento">Fretamento de viatura</option>
          <option value="aluguel_motorista">Aluguel de motorista</option>
        </select>
        <label for="origem">Origem:</label>
        <input type="text" id="origem" name="origem" placeholder="Exemplo: Luanda" required>
        <label for="destino">Destino:</label>
        <input type="text" id="destino" name="destino" placeholder="Exemplo: Benguela" required>
        <label for="data">Data da viagem:</label>
        <input type="date" id="data" name="data" required>
        <label for="passageiros">Número de passageiros:</label>
        <input type="number" id="passageiros" name="passageiros" min="1" required>
        <textarea id="detalhes" name="detalhes" placeholder="Detalhes adicionais (horário, tipo de veículo, etc.)"></textarea>
        <button type="submit">Enviar Orçamento</button>
        <div class="form-status" id="orcamento-status"></div>
      </form>
    </section>
